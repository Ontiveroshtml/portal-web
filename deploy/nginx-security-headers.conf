# Cabeceras de seguridad para nginx. Pegar dentro del bloque `server { }` que sirve este sitio
# (o incluir con `include /ruta/nginx-security-headers.conf;`) y recargar nginx.
# NO se aplican solas: este archivo no hace nada hasta que se instale en el VPS.
#
# La CSP va en modo "solo reportar" (Content-Security-Policy-Report-Only): no bloquea nada, solo
# deja avisos en la consola del navegador. Probar unos días, ajustar los dominios que falten
# (Firebase, Stripe, fuentes, la API) y, cuando no salgan avisos, cambiar el nombre de la cabecera
# a `Content-Security-Policy` para que empiece a bloquear.
# Ajustar api.guildcore.pro al dominio real de la API.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://apis.google.com https://accounts.google.com https://js.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com https://accounts.google.com https://*.firebaseapp.com; connect-src 'self' https://api.guildcore.pro https://api.stripe.com https://*.firebaseio.com https://*.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# IMPORTANTE: `add_header` dentro de un `location` ANULA los del `server`; si se usa un location con
# sus propias cabeceras hay que repetir aquí todas las de arriba.
# HSTS con includeSubDomains exige que TODOS los subdominios tengan HTTPS: si alguno no lo tiene,
# quitar `includeSubDomains`.
#
# Para las rutas con tokens en la URL (enlaces públicos y checkout a medida) conviene no filtrar
# el referrer. Ejemplo:
# location ~ ^/(s|r|checkout-a-medida)/ {
#   add_header Referrer-Policy "no-referrer" always;
#   try_files $uri /index.html;
# }
