<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/avif" href="/brand/brand-logo-gc.avif" />
    <link rel="apple-touch-icon" href="/brand/brand-logo-gc.avif" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#131315" />

    <title>Guild Core — Clan management for FateWar</title>
    <meta
      name="description"
      content="Upload your FateWar clan's screenshots and Guild Core fills in the numbers for you: donations, payouts, Events and rankings. Fewer hours managing, more hours playing."
    />

    <!-- Vista previa al compartir el link (Discord, WhatsApp, Twitter).
         Discord y Twitter no resuelven rutas relativas, por eso og:image es
         absoluta. OJO: no leen AVIF; hace falta un PNG/JPG en public/brand/ y
         apuntar og:image a el para que la tarjeta muestre imagen. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Guild Core" />
    <meta property="og:title" content="Guild Core — Clan management for FateWar" />
    <meta
      property="og:description"
      content="Your clan's screenshots read themselves. Donations, payouts, Events and rankings without spreadsheets."
    />
    <meta property="og:image" content="https://guildcore.pro/brand/brand-logo-gc.avif" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,800;0,900;1,800;1,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
